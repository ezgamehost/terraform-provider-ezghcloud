name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go vet ./...
      - name: Unit and Terraform lifecycle tests
        env:
          TF_ACC: '1'
        run: go test -race -timeout 7m ./...
      - name: Documentation drift
        run: |
          go tool tfplugindocs generate --provider-name ezghcloud
          git diff --exit-code -- docs
      - name: Cross compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" CGO_ENABLED=0 go build -o /tmp/provider-build .
          done
